# A run of this repository on another machine of the user: `bd-host run studio -- <command>`, or `yonder run studio`
# during the migration (docs/guidelines/studio-runs.md). bd-host reads this file while `.branchdeck.toml` has no `[host]`
# table (spec/cli/host.spec.md, "The environment of a run and `[host]`"); yonderd reads only this file.

# What a run makes and brings back into the same paths here
outputs = ["tests/results", "playwright-report", "target/nextest/ci/junit.xml"]

[env]
# the mock server of the E2E suite: one port per slot, so two slots of the host never meet
E2E_PORT = { port = 3100 }

[[prepare]]
name = "pnpm install"
run = ["pnpm", "install", "--frozen-lockfile", "--config.confirm-modules-purge=false"]
inputs = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
creates = ["node_modules"]
