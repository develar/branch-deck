<div class="flex min-w-0 flex-col gap-2" data-testid="review-brief-section">
  <div class="flex min-w-0 flex-wrap items-baseline gap-x-2">
    <h3 class="min-w-0 text-sm font-semibold">
      Limits
    </h3>
  </div>
  <table class="-ml-[14px] max-w-[calc(100%+14px)] border-collapse self-start text-sm" data-testid="review-brief-table">
    <thead>
      <tr class="text-xs text-muted-foreground" data-testid="review-brief-table-head">
        <th class="py-1 pr-4 text-left align-baseline font-normal [overflow-wrap:anywhere] border-l-2 pl-3 border-transparent" scope="col">
          <span>
            Limit
          </span>
        </th>
        <th class="py-1 pr-4 text-left align-baseline font-normal [overflow-wrap:anywhere]" scope="col">
          <span>
            Value
          </span>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr class="border-t border-border" data-change="added" data-testid="review-brief-row">
        <td class="py-1 pr-4 text-left align-baseline font-normal [overflow-wrap:anywhere] border-l-2 pl-3 border-success">
          <span class="sr-only">
            Added:
          </span>
          <span>
            Tool windows
          </span>
        </td>
        <td class="py-1 pr-4 text-left align-baseline font-normal [overflow-wrap:anywhere]">
          <span>
            40
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
