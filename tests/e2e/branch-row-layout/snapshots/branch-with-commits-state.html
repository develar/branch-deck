            test-branch

        </div>
      </td>
      <td class="hidden w-px px-4 py-(--bd-cell-y) whitespace-nowrap sm:table-cell">
        <div class="flex shrink-0 min-w-(--bd-track-commits) justify-end" data-track="commits">
          <div class="flex w-max min-w-0 items-center">
            <span class="text-sm text-muted-foreground tabular-nums">
              1
            </span>
          </div>
        </div>
      </td>
      <td class="hidden w-px px-4 py-(--bd-cell-y) whitespace-nowrap sm:table-cell">
        <div class="flex items-center min-w-(--bd-group-status)">
          <div class="flex shrink-0 min-w-(--bd-track-state)" data-track="state">
            <div class="flex w-max min-w-0 items-center max-w-40">
              <div class="min-w-0">
                <span class="flex max-w-full items-center gap-2 text-sm text-muted-foreground tabular-nums" data-slot="tooltip-trigger">
                  <span aria-hidden="true" class="size-1.5 shrink-0 rounded-full bg-primary" data-color="primary" data-testid="branch-status-dot" />
                  <span class="truncate" data-testid="branch-status">

                </span>
              </div>
            </div>
          </div>
          <div class="flex shrink-0 ms-(--bd-gap-pr) min-w-(--bd-track-pr)" data-track="pr" />
          <div class="flex shrink-0 ms-(--bd-gap-landed) min-w-(--bd-track-landed)" data-track="landed" />
        </div>
      </td>
      <td class="relative w-px px-4 py-(--bd-cell-y) whitespace-nowrap">
        <div class="flex items-center min-w-(--bd-group-actions)">
          <div class="flex shrink-0 me-(--bd-gap-push) min-w-(--bd-track-push)" data-track="push">

              <button aria-disabled="false" aria-expanded="false" aria-haspopup="dialog" aria-label="Push Branch (1)" class="group/button inline-flex shrink-0 items-center rounded-2xl border border-transparent bg-clip-padding whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 font-normal hover:text-foreground dark:hover:bg-muted/50 h-6 gap-1 px-2.5 text-xs has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 [&_svg:not([class*='size-'])]:size-3 tabular-nums min-w-16 justify-start text-foreground hover:bg-primary/10 aria-expanded:bg-primary/10 aria-expanded:text-foreground [&_svg]:text-primary aria-disabled:opacity-50" data-slot="popover-trigger" data-stack-path="push" data-testid="push-button" tabindex="0" type="button">

            </div>
          </div>
          <div class="flex shrink-0 me-(--bd-gap-step) min-w-(--bd-track-step)" data-track="step" />
          <div class="flex shrink-0 min-w-(--bd-track-more)" data-track="more">

              <button aria-disabled="false" aria-expanded="false" aria-haspopup="menu" aria-label="More actions for test-branch" class="group/button inline-flex shrink-0 items-center justify-center rounded-2xl border border-transparent bg-clip-padding text-sm whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 font-normal hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 size-6 [&_svg:not([class*='size-'])]:size-3 text-muted-foreground aria-disabled:opacity-50" data-slot="tooltip-trigger" tabindex="0" type="button">
                <svg aria-hidden="true" class="lucide lucide-ellipsis" />
              </button>
            </div>
          </div>
        </div>
      </td>
    </tr>
  </tbody>
</table>
