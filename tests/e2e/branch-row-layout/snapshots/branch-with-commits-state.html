<table class="w-full">
  <thead class="border-b border-border bg-muted/50">
    <tr>
      <th class="px-6 py-3 text-left text-sm font-medium text-foreground">
        Branch Name
      </th>
      <th class="px-6 py-3 text-left text-sm font-medium text-foreground hidden sm:table-cell">
        Commits
      </th>
      <th class="px-6 py-3 text-left text-sm font-medium text-foreground hidden sm:table-cell">
        Status
      </th>
      <th class="px-6 py-3 text-left text-sm font-medium text-foreground">
        Actions
      </th>
    </tr>
  </thead>
  <tbody class="divide-y divide-border">
    <tr class="group cursor-pointer transition-all hover:bg-muted select-none" data-branch-name="test-branch" data-slot="context-menu-trigger" data-state="closed" data-testid="branch-row">
      <td class="max-w-xs px-6 py-4">
        <div class="flex min-w-0 items-center gap-2">
          <button aria-expanded="false" aria-label="Expand" class="group/button inline-flex items-center justify-center rounded-2xl border border-transparent bg-clip-padding text-sm whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 font-normal hover:bg-muted aria-expanded:bg-muted dark:hover:bg-muted/50 size-6 [&_svg:not([class*='size-'])]:size-3 shrink-0 text-primary hover:text-primary aria-expanded:text-primary" data-slot="button" tabindex="0" type="button">
            <svg aria-hidden="true" class="lucide lucide-folder-closed" />
          </button>
          <span class="shrink-0 text-sm font-medium">
            test-branch
          </span>
        </div>
      </td>
      <td class="hidden px-6 py-4 sm:table-cell">
        <span class="text-sm text-muted-foreground">
          1 commit
        </span>
      </td>
      <td class="hidden px-6 py-4 sm:table-cell">
        <div class="w-40">
          <span aria-expanded="false" aria-haspopup="dialog" class="flex max-w-40 items-center gap-2 text-sm text-muted-foreground" data-base-ui-click-trigger="" data-slot="popover-trigger" id="base-ui-[ID]" role="button" tabindex="0">
            <span aria-hidden="true" class="size-1.5 shrink-0 rounded-full bg-primary" />
            <span class="truncate lowercase">
              not pushed
            </span>
          </span>
        </div>
      </td>
      <td class="px-6 py-4">
        <div class="flex items-center gap-2">
          <div class="copy-button transition-opacity">
            <button aria-label="Copy full branch name" class="group/button inline-flex shrink-0 items-center justify-center rounded-2xl border border-transparent bg-clip-padding text-sm whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 font-normal hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 size-6 [&_svg:not([class*='size-'])]:size-3 text-muted-foreground" data-base-ui-tooltip-trigger="" data-slot="tooltip-trigger" id="base-ui-[ID]" tabindex="0" type="button">
              <svg aria-hidden="true" class="lucide lucide-copy" />
            </button>
          </div>
          <button aria-expanded="false" aria-haspopup="dialog" class="group/button inline-flex shrink-0 items-center justify-center rounded-2xl border border-transparent bg-clip-padding whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 font-normal aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 h-6 gap-1 px-2.5 text-xs has-data-[icon=inline-end]:pr-2 has-data-[icon=inline-start]:pl-2 [&_svg:not([class*='size-'])]:size-3 text-primary hover:bg-primary/10 hover:text-primary" data-base-ui-click-trigger="" data-slot="popover-trigger" id="base-ui-[ID]" tabindex="0" type="button">
            <svg aria-hidden="true" class="lucide lucide-upload" data-icon="inline-start" />
            Create Remote
          </button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
