<table class="w-full">

        </div>
      </td>
      <td class="hidden px-6 py-4 sm:table-cell">

      <td class="hidden px-6 py-4 sm:table-cell">
        <div class="w-40">

      <td class="px-6 py-4">

          <button aria-expanded="false" aria-haspopup="dialog" class="group/button inline-flex shrink-0 items-center justify-center border bg-clip-padding font-medium whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/50 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 bg-background aria-expanded:bg-muted aria-expanded:text-foreground dark:border-input dark:bg-input/30 dark:hover:bg-input/50 h-6 gap-1 rounded-[min(var(--radius-md),10px)] px-2 text-xs in-data-[slot=button-group]:rounded-lg has-data-[icon=inline-end]:pr-1.5 has-data-[icon=inline-start]:pl-1.5 [&_svg:not([class*='size-'])]:size-3 border-primary/50 text-primary hover:bg-primary/10 hover:text-primary" data-base-ui-click-trigger="" data-slot="popover-trigger" id="base-ui-[ID]" tabindex="0" type="button">
