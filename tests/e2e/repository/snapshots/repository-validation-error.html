<body>
  <div class="isolate" id="root">
    <div class="flex h-dvh flex-col" data-testid="app-container">
      <header class="@container flex h-10 shrink-0 items-center gap-4 select-none pl-2 pr-2" data-testid="configuration-header" data-title-bar="native">
        <div class="flex min-w-0 flex-1 items-center gap-3 has-data-[main-menu=expanded]:*:not-data-main-menu:invisible">
          <div class="relative inline-flex items-center *:not-first:-ml-px *:not-first:rounded-l-none *:not-last:rounded-r-none *:focus-visible:z-10 min-w-0" data-base-ui-tooltip-trigger="" data-slot="tooltip-trigger" id="base-ui-[ID]">
            <button aria-expanded="false" aria-haspopup="listbox" aria-invalid="true" class="flex items-center justify-between gap-1.5 rounded-md border px-2 py-1.5 whitespace-nowrap transition-colors outline-none focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/30 disabled:cursor-not-allowed disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-2 aria-invalid:ring-destructive/20 data-placeholder:text-muted-foreground data-[size=default]:h-7 data-[size=sm]:h-6 *:data-[slot=select-value]:line-clamp-1 *:data-[slot=select-value]:flex *:data-[slot=select-value]:items-center *:data-[slot=select-value]:gap-1.5 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-3.5 w-3xs min-w-0 border-input bg-background" data-size="sm" data-slot="select-trigger" id="base-ui-[ID]" role="combobox" tabindex="0" type="button">
              <span class="flex flex-1 text-left" data-slot="select-value">
                <span class="truncate" dir="rtl">
                  <bdi>
                    NO_REPO_[REPO_ID]
                  </bdi>
                </span>
              </span>
              <svg aria-hidden="true" class="lucide lucide-chevron-down pointer-events-none size-3.5 text-muted-foreground" />
            </button>
            <input aria-hidden="true" id="base-ui-[ID]-hidden-input" style="clip-path: inset(50%);  overflow: hidden;  white-space: nowrap;  border: 0px;  padding: 0px;  width: 1px;  height: 1px;  margin: 0px;  position: fixed;  top: 0px;  left: 0px" tabindex="-1" value="NO_REPO_[REPO_ID]" />
            <button aria-label="Browse repository" class="group/button inline-flex shrink-0 items-center justify-center rounded-md border bg-clip-padding whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-2 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 bg-background font-normal aria-expanded:bg-[color-mix(in_oklch,var(--background),var(--foreground)_5%)] aria-expanded:text-foreground dark:bg-transparent dark:hover:bg-muted dark:aria-expanded:bg-muted size-6 [&_svg:not([class*='size-'])]:size-3.5 border-destructive/50 text-destructive hover:bg-destructive/10 hover:text-destructive" data-slot="button" data-testid="browse-repository-button" tabindex="0" type="button">
              <svg aria-hidden="true" class="lucide lucide-folder-search" />
            </button>
          </div>
        </div>
        <div class="flex shrink-0 items-center gap-3">
          <button aria-disabled="true" class="group/button inline-flex shrink-0 items-center justify-center rounded-md border border-transparent bg-clip-padding whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-2 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 font-normal hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 h-6 gap-1 px-2 has-data-[icon=inline-end]:pr-1.5 has-data-[icon=inline-start]:pl-1.5 [&_svg:not([class*='size-'])]:size-3.5 opacity-50" data-base-ui-tooltip-trigger="" data-disabled="" data-slot="tooltip-trigger" data-testid="sync-button" id="base-ui-[ID]" tabindex="0" type="button">
            <svg aria-hidden="true" class="lucide lucide-refresh-cw" data-icon="inline-start" />
            Sync
          </button>
          <button aria-label="Settings" class="group/button inline-flex shrink-0 items-center justify-center rounded-md border border-transparent bg-clip-padding whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-2 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 font-normal hover:bg-muted hover:text-foreground aria-expanded:bg-muted aria-expanded:text-foreground dark:hover:bg-muted/50 size-6 [&_svg:not([class*='size-'])]:size-3.5" data-base-ui-tooltip-trigger="" data-slot="tooltip-trigger" data-testid="settings-button" id="base-ui-[ID]" tabindex="0" type="button">
            <svg aria-hidden="true" class="lucide lucide-settings" />
          </button>
        </div>
      </header>
      <div class="min-h-0 flex-1">
        <div class="flex h-full w-full aria-[orientation=vertical]:flex-col" data-group="true" data-slot="resizable-panel-group" id="[ID]" style="height: 100%;  width: 100%;  overflow: hidden;  display: flex;  flex-flow: row;  touch-action: pan-y">
          <div data-panel="true" data-slot="resizable-panel" data-testid="main" id="main" style="min-height: 0px;  max-height: 100%;  height: auto;  min-width: 0px;  max-width: 100%;  width: auto;  border: 0px;  padding: 0px;  margin: 0px;  display: flex;  flex: 100 1 0px;  overflow: visible">
            <div style="max-height: 100%;  max-width: 100%;  flex-grow: 1;  overflow: auto;  touch-action: pan-y">
              <main class="h-full overflow-y-auto" data-testid="branches-view">
                <div class="w-full px-2 pb-2">
                  <div class="flex flex-col gap-2" data-testid="branch-creator-root">
                    <div class="alert group/alert relative grid w-full gap-0.5 rounded-lg border px-4 py-3 text-left has-data-[slot=alert-action]:relative has-data-[slot=alert-action]:pr-18 has-[>svg]:grid-cols-[auto_1fr] has-[>svg]:gap-x-2.5 *:[svg]:row-span-2 *:[svg]:translate-y-0.5 *:[svg]:text-current *:[svg:not([class*='size-'])]:size-4 border-destructive/25 bg-[color-mix(in_srgb,var(--destructive)_10%,var(--card))] text-destructive *:data-[slot=alert-description]:text-destructive" data-slot="alert" data-testid="error-alert" role="alert">
                      <svg aria-hidden="true" class="lucide lucide-circle-x" />
                      <div class="font-medium group-has-[>svg]/alert:col-start-2 [&_a]:underline [&_a]:underline-offset-3 [&_a]:hover:text-foreground" data-slot="alert-title">
                        Repository not accessible: NO_REPO_[REPO_ID]
                      </div>
                    </div>
                  </div>
                </div>
              </main>
              <main class="h-full overflow-y-auto" style="display: none !important" />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div data-base-ui-portal="" data-slot="toast-portal" id="[ID]" />
</body>
