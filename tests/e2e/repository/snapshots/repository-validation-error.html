              <input aria-hidden="true" id="base-ui-[ID]-hidden-input" style="clip-path: inset(50%);  overflow: hidden;  white-space: nowrap;  border: 0px;  padding: 0px;  width: 1px;  height: 1px;  margin: 0px;  position: fixed;  top: 0px;  left: 0px" tabindex="-1" value="NO_REPO_[REPO_ID]" />
              <button aria-label="Browse repository" class="group/button inline-flex shrink-0 items-center justify-center rounded-2xl border bg-clip-padding text-sm whitespace-nowrap transition-all outline-none select-none focus-visible:border-ring focus-visible:ring-3 focus-visible:ring-ring/30 active:not-aria-[haspopup]:translate-y-px disabled:pointer-events-none disabled:opacity-50 aria-invalid:border-destructive aria-invalid:ring-3 aria-invalid:ring-destructive/20 dark:aria-invalid:border-destructive/50 dark:aria-invalid:ring-destructive/40 [&_svg]:pointer-events-none [&_svg]:shrink-0 [&_svg:not([class*='size-'])]:size-4 bg-background font-normal aria-expanded:bg-[color-mix(in_oklch,var(--background),var(--foreground)_5%)] aria-expanded:text-foreground dark:bg-transparent dark:hover:bg-input/30 size-7 border-destructive/50 text-destructive hover:bg-destructive/10 hover:text-destructive" data-slot="button" data-testid="browse-repository-button" tabindex="0" type="button">
                <svg aria-hidden="true" class="lucide lucide-folder-search" />

            <div class="relative inline-flex items-center *:focus-visible:z-10 *:not-first:-ml-px *:not-first:rounded-l-none *:not-last:rounded-r-none" data-base-ui-tooltip-trigger="" data-slot="tooltip-trigger" id="base-ui-[ID]">

                <svg aria-hidden="true" class="lucide lucide-refresh-cw" data-icon="inline-start" />

            <div class="alert group/alert relative grid w-full gap-0.5 rounded-2xl border px-4 py-3 text-left text-sm has-data-[slot=alert-action]:relative has-data-[slot=alert-action]:pr-18 has-[>svg]:grid-cols-[auto_1fr] has-[>svg]:gap-x-2.5 *:[svg]:row-span-2 *:[svg]:translate-y-0.5 *:[svg]:text-current *:[svg:not([class*='size-'])]:size-4 border-destructive/25 bg-destructive/10 text-destructive *:data-[slot=alert-description]:text-destructive/90" data-slot="alert" data-testid="error-alert" role="alert">

              <div class="font-medium group-has-[>svg]/alert:col-start-2 [&_a]:underline [&_a]:underline-offset-3 [&_a]:hover:text-foreground" data-slot="alert-title">
