# Documentation: https://nexte.st/docs/configuration/
# flaky-result needs 0.9.131
nextest-version = { required = "0.9.131", recommended = "0.9.148" }

[profile.default]
# a hung git (a prompt, a full pipe) is killed after 5 minutes instead of holding the run
slow-timeout = { period = "60s", terminate-after = 5 }
# a git process that outlives its test fails the test
leak-timeout = { period = "500ms", result = "fail" }

# The binaries whose tests take longest start first (their mean test took 3–8 s in a run on the Studio, the others under
# 3 s), so the end of a run is the short tests of the rest and not one of these started last. A test's time follows its
# git processes (docs/guidelines/rust-tests.md)
[[profile.default.overrides]]
filter = 'binary_id(bd-remote) | binary_id(bd-update) | binary_id(update-core) | binary_id(bd-rewrite) | binary_id(bd-lease)'
priority = 10

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
# a test that passes on a retry is FLAKY, and the run still fails: a flaky test is a race to fix
retries = 2
flaky-result = "fail"
# a bound for the whole run, past the slow-timeout of each test: the Windows runner takes about half an hour for the
# suite, and a run cut by this bound fails with the tests it never started
global-timeout = "60m"

[profile.ci.junit]
path = "junit.xml"
