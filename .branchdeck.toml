# The clean rules of a slot of the bd lease pool: `bd lease return` applies them before it frees the slot, and
# `bd lease clean` applies them on demand (openspec/specs/cli/lease/spec.md). Cargo never deletes a unit whose hash went out of
# use, so a reused slot piles up dozens of copies of every workspace crate within hours.
[lease]
clean = [
  # the stale units of every profile dir of target/: the 8 newest of each package and the ones built in the last hour stay
  { cargo = "target", keep = 8, age = "1h" },
  # the artifacts of the e2e tests (`outputDir` of playwright.config.ts) and of the HTML report
  { delete = "tests/results" },
  { delete = "playwright-report" },
]

# A run of this repository on another machine of the user: `bd-host run studio -- <command>`
# (docs/contributing/studio-runs.md, openspec/specs/cli/host/spec.md "The environment of a run and `[host]`"). A bd built before
# this table was allowed refuses the whole file and then applies no clean rule.
[host]
# What a run makes and brings back into the same paths here
outputs = ["tests/results", "playwright-report", "target/nextest/ci/junit.xml"]
# The heavy runs, which the host runs one at a time, whatever their repository (`*` matches any characters): the whole
# Rust suite (the workspace is a virtual manifest without default members, so a run without `-p` builds all of it, with
# a filter `-E` or a rerun `-R` too), clippy of the workspace, every E2E and Playwright run (a single spec too, as the
# load of a neighbour fails its timeouts), the measurements, the release build, and each script of package.json that
# runs one of them, also as `pnpm run` (`the_host_table_of_this_repository_parses` names every script heavy or light).
# A brd-host built before Branch Deck knew `heavy` (39f21bb44) refuses every run of a commit with it: this Mac and the
# host both run a later one
heavy = [
  "cargo nextest run",
  "cargo nextest run --no-fail-fast",
  "cargo nextest run*--workspace*",
  "cargo nextest run -E *",
  "cargo nextest run --no-fail-fast -E *",
  "cargo nextest run -R *",
  "cargo clippy*--workspace*",
  "pnpm exec playwright test*",
  "pnpm e2e*",
  "pnpm run e2e*",
  "pnpm test",
  "pnpm run test",
  "pnpm test:backend*",
  "pnpm run test:backend*",
  "pnpm lint",
  "pnpm run lint",
  "pnpm lint:backend*",
  "pnpm run lint:backend*",
  "pnpm fix:backend*",
  "pnpm run fix:backend*",
  "pnpm perf:*",
  "pnpm run perf:*",
  "pnpm screenshots:*",
  "pnpm run screenshots:*",
  "pnpm tauri build*",
  "pnpm run tauri build*",
  "pnpm install-app",
  "pnpm run install-app",
]

[host.env]
# the mock server of the E2E suite: one port per slot, so two slots of the host never meet
E2E_PORT = { port = 3100 }

[[host.prepare]]
name = "pnpm install"
run = ["pnpm", "install", "--frozen-lockfile", "--config.confirm-modules-purge=false"]
inputs = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
creates = ["node_modules"]

# The commit rules of this repository: `brd pick` and `brd lease pick` refuse a message whose subject, after the
# `(branch)` prefix, is not a conventional commit (`message_format`, openspec/specs/cli/pick/spec.md "The commit rules").
# release-please reads these subjects.
[commit]
check = ['(feat|fix|docs|refactor|perf|test|chore|style|build|ci|revert)(\([^)]+\))?!?: .+', 'Revert ".+']
