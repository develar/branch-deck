cargo-features = ["profile-rustflags"]

[workspace]
members = [
  "src-tauri",
  "crates/app-api",
  "crates/git-ops",
  "crates/test-utils",
  "crates/test-server",
  "crates/sync-core",
  "crates/update-core",
  "crates/trial-check",
  "crates/lease-pool",
  "crates/remote-facts",
  "crates/repository-model",
  "crates/operations",
  "crates/history-rewrite",
  "crates/domain-types",
  "crates/domain-policy",
  "crates/app-settings",
  "crates/sync-utils",
  "crates/cli-tools",
  "crates/branch-integration",
  "crates/git-executor",
  "crates/bd-cli",
  "crates/bd-core",
  "crates/bd-lease",
  "crates/bd-remote",
  "crates/bd-rewrite",
  "crates/bd-update",
  "crates/commit-clustering",
  "crates/object-cache",
  "crates/patronus",
  "crates/github",
  "crates/youtrack",
  "crates/code-symbols",
  "crates/text-diff",
  "crates/file-diffs",
  "crates/host-link",
  "crates/host-client",
  "crates/host-agent",
  "crates/bd-host",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
# ============================================================================
# Workspace Dependencies - Shared across multiple crates
# ============================================================================

# Core utilities
anyhow = { version = "1.0.104", features = ["default", "backtrace"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "net", "sync", "process", "signal"] }
tracing = { version = "0.1.44", features = ["max_level_debug", "release_max_level_info", "log"] }

# Tauri framework
tauri = { version = "2.12.5", features = [] }

# Testing utilities
pretty_assertions = "1.4"
tempfile = "3.27.0"
test-log = { version = "0.2", features = ["trace"] }

# Logging and tracing
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }

# Common utilities
getrandom = "0.4.3"
# the local calendar of the statistics (`domain_types::calendar`) and the timestamps of `sync_utils::timestamp`
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
indexmap = "2.14.2"
dashmap = "6.2.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
axum = "0.8.9"

# Error types
thiserror = "2.0.21"

# Caching
moka = { version = "0.12", features = ["sync"] }

# JSON schemas of the `bd` output
schemars = "1.2"

# Specta for type generation (most comprehensive feature set)
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "0.0.13"

# Additional tokio utilities
tokio-stream = "0.1"

# The watch of the operations registry of a repository by the app's sessions (`operations::registry_watch`): FSEvents,
# inotify, ReadDirectoryChangesW
notify = "8.2.1"

# The remote runs of `bd-host` (docs/design/host-runs.md): TLS 1.3 on the provider the app links through reqwest
# (`aws-lc-rs`), so no second provider comes in; the self-signed certificate of each end; Ctrl+C of a run
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
ctrlc = "3.5.2"

# Every warning fails `pnpm lint:backend` and CI (`-D warnings`, all targets): a lint is either on or allowed below with
# its reason, and a single exception in code is `#[expect(lint, reason = "...")]`, never `#[allow]`.
[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
# trivial_casts: the expansion of `#[specta::specta]` casts every Tauri command to its own fn pointer type
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# restriction lints that catch defects, not style
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
cfg_not_test = "warn"
clone_on_ref_ptr = "warn"
create_dir = "warn"
dbg_macro = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
filetype_is_file = "warn"
format_push_string = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
needless_raw_strings = "warn"
print_stderr = "warn"
rest_pat_in_fully_bound_structs = "warn"
string_add = "warn"
todo = "warn"
try_err = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
verbose_file_reads = "warn"
# nursery and cargo lints that conflict with another lint or are wrong for this code:
# the first paragraph of a doc comment is the whole description here, one or two sentences long
too_long_first_doc_paragraph = "allow"
# `if let … else` reads better than `map_or_else` with two closures
option_if_let_else = "allow"
# the opposite of rustc's `unreachable_pub`, which is on
redundant_pub_crate = "allow"
# a `for` over a hash map is wrong only when its order reaches the output; the results whose order shows are BTreeMaps
# or sorted, the other loops build sets, git batch input and counts
iter_over_hash_type = "allow"
# its suggestions break scoped blocks and DashMap guards; none of its findings was a contention
significant_drop_tightening = "allow"
# it flags comparisons of two different fields, which is what they are meant to be
suspicious_operation_groupings = "allow"
# git revisions such as `HEAD^{tree}` are not format arguments
literal_string_with_formatting_args = "allow"
# the crates are not published; the duplicate versions come from Tauri's and GTK's dependency graph
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Unix timestamps in tests and templates are conventionally written without separators.
unreadable_literal = "allow"
# Test bindings and git terms (oid/oids, base/bases) trip this lint without being confusing.
similar_names = "allow"
# Test fixtures, repo templates and the sync pipeline are long linear procedures; splitting them adds only indirection.
too_many_lines = "allow"
# `test_log::test` injects statements before the test body, so every item inside a test is flagged.
items_after_statements = "allow"
# Internal application functions never need custom hashers; generic `S: BuildHasher` parameters only add noise.
implicit_hasher = "allow"

# Dependencies keep line tables for backtraces; full debug info (variables for a debugger) only in workspace crates,
# so the dev units of target/ stay smaller.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization
lto = true # Enables link-time-optimizations
opt-level = "s" # Prioritizes small binary size
panic = "abort" # Higher performance by disabling panic handlers
strip = true # Ensures debug symbols are removed
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
