cargo-features = ["profile-rustflags"]

[workspace]
members = ["src-tauri", "crates/git-ops", "crates/test-utils", "crates/test-server", "crates/sync-core", "crates/sync-types", "crates/sync-utils", "crates/branch-integration", "crates/integration-detection-tests", "crates/sync-test-utils", "crates/git-executor", "crates/bd-cli", "crates/object-cache", "crates/patronus"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
# ============================================================================
# Workspace Dependencies - Shared across multiple crates
# ============================================================================

# Core utilities
anyhow = { version = "1.0.104", features = ["default", "backtrace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "macros", "net", "sync", "process", "signal"] }
tracing = { version = "0.1.44", features = ["max_level_debug", "release_max_level_info", "log"] }

# Tauri framework
tauri = { version = "2.12.3", features = [] }

# Testing utilities
pretty_assertions = "1.4"
tempfile = "3.27.0"
test-log = { version = "0.2", features = ["trace"] }

# Logging and tracing
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "registry"] }

# Common utilities
indexmap = "2.14.2"
dashmap = "6.2.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
axum = "0.8.9"

# Caching
moka = { version = "0.12", features = ["sync"] }

# Specta for type generation (most comprehensive feature set)
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }

# Additional tokio utilities
tokio-stream = "0.1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Unix timestamps in tests and templates are conventionally written without separators.
unreadable_literal = "allow"
# Test bindings and git terms (oid/oids, base/bases) trip this lint without being confusing.
similar_names = "allow"
# Test fixtures, repo templates and the sync pipeline are long linear procedures; splitting them adds only indirection.
too_many_lines = "allow"
# `test_log::test` injects statements before the test body, so every item inside a test is flagged.
items_after_statements = "allow"
# Internal application functions never need custom hashers; generic `S: BuildHasher` parameters only add noise.
implicit_hasher = "allow"

[profile.release]
codegen-units = 1          # Allows LLVM to perform better optimization
lto = true                 # Enables link-time-optimizations
opt-level = "s"            # Prioritizes small binary size
panic = "abort"            # Higher performance by disabling panic handlers
strip = true               # Ensures debug symbols are removed
trim-paths = "all"
rustflags = ["-Cdebuginfo=0", "-Zthreads=8"]
