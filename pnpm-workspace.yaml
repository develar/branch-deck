allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  esbuild: true
  unrs-resolver: true

overrides:
  zod: ^4.6.5
  # GHSA-g3hv-75wg-m249 has no fix in minimatch 10; ts-morph (shadcn's CLI) calls only minimatch(path, pattern), the same in 11
  "@ts-morph/common>minimatch": ^11.0.1
  vite@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# a dependency's bug fixed by a patch, whose header says the bug, the upstream code and how to port it; an upgrade fails
# `pnpm install` until the patch is ported or dropped (docs/contributing/frontend.md, "Patched Dependencies")
patchedDependencies:
  # a popup that went at the end of its exit cleared the open delay of its trigger's hover
  "@base-ui/react@1.9.0": patches/@base-ui__react@1.9.0.patch
