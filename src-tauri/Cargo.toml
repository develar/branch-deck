[package]
name = "branch-deck"
version.workspace = true
description = "Branch Deck"
authors = ["Vladimir Krivosheev"]
edition.workspace = true
default-run = "branch-deck"

[features]
default = ["specta"]
specta = ["dep:specta"]
auto-update = ["dep:tauri-plugin-updater"]
devtools = ["dep:tauri-plugin-devtools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "branch_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Define the main binary
[[bin]]
name = "branch-deck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri.workspace = true
serde.workspace = true
sync-core = { path = "../crates/sync-core", features = ["specta"] }
sync-types = { path = "../crates/sync-types", features = ["specta"] }
branch-integration = { path = "../crates/branch-integration", features = ["specta"] }
# Referenced by the `tauri::generate_context!` expansion, not by source code
#noinspection CargoUnusedDependency
serde_json.workspace = true
specta = { workspace = true, optional = true }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
anyhow.workspace = true
tracing.workspace = true
log = "0.4"

# Development dependencies (feature-gated)
tauri-plugin-devtools = { version = "2.2.2", optional = true }
moka.workspace = true

# Crate dependencies
git-ops = { path = "../crates/git-ops", features = ["specta"] }
git-executor = { path = "../crates/git-executor" }
model-core = { path = "../crates/model-core" }
model-ai = { path = "../crates/model-ai", features = ["specta"] }
tokio.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-window-state = "2"

# Platform-specific ML acceleration
[target.'cfg(target_os = "macos")'.dependencies]
model-tauri = { path = "../crates/model-tauri", features = ["metal", "accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
model-tauri = { path = "../crates/model-tauri" }

[dev-dependencies]
tempfile = "3"

[package.metadata.cargo-machete]
# tauri-build: build dependency used in build.rs; serde_json: used by `tauri::generate_context!`
ignored = ["tauri-build", "serde_json"]


[lints]
workspace = true
