[package]
name = "branch-deck"
version.workspace = true
description = "Branch Deck"
authors = ["Vladimir Krivosheev"]
edition.workspace = true
license.workspace = true
default-run = "branch-deck"

[features]
auto-update = ["dep:tauri-plugin-updater"]
devtools = ["dep:tauri-plugin-devtools"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "branch_deck_lib"
# rlib only: staticlib and cdylib are for the mobile targets, which the app does not build; each copied all
# dependencies into a 1 GB archive per build
crate-type = ["rlib"]

# Define the main binary
[[bin]]
name = "branch-deck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri.workspace = true
serde.workspace = true
sync-core = { path = "../crates/sync-core", features = ["specta"] }
history-rewrite = { path = "../crates/history-rewrite", features = ["specta"] }
sync-types = { path = "../crates/sync-types", features = ["specta"] }
sync-utils = { path = "../crates/sync-utils" }
branch-integration = { path = "../crates/branch-integration", features = ["specta"] }
serde_json.workspace = true
specta.workspace = true
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
log = "0.4"

# Development dependencies (feature-gated)
tauri-plugin-devtools = { version = "2.2.2", optional = true }
moka.workspace = true

# Crate dependencies
git-ops = { path = "../crates/git-ops", features = ["specta"] }
file-diffs = { path = "../crates/file-diffs", features = ["specta"] }
git-executor = { path = "../crates/git-executor" }
object-cache = { path = "../crates/object-cache" }
patronus = { path = "../crates/patronus" }
github = { path = "../crates/github" }
youtrack = { path = "../crates/youtrack" }
bd-cli = { path = "../crates/bd-cli" }
bd-core = { path = "../crates/bd-core" }
tokio.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-window-state = "2"

# the key equivalent of Zoom In (`menu.rs`): tauri sets only key-code accelerators
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }

# the title bar reads GTK's settings (the button layout, the icon theme, the double-click action) and sets the empty
# titlebar of a window (`title_bar.rs`); tauri builds on the same gtk 0.18 and doesn't re-export it
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# the right clicks of the webview, for the window menu of the title bar (`show_window_menu`)
webkit2gtk = "2.0"

# the system menu of the window for a right click on the title bar (`show_window_menu`), the version tauri uses
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
test-utils = { path = "../crates/test-utils" }

[package.metadata.cargo-machete]
# tauri-build: build dependency used in build.rs
ignored = ["tauri-build"]


[lints]
workspace = true
