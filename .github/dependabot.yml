version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # glib vulnerability only affects Linux builds, not macOS or Windows
      # The GTK dependencies are only compiled on Linux systems
      # See: https://github.com/tauri-apps/tauri/issues/12048
      - dependency-name: "glib"
        versions: ["< 0.20.0"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      # Vite+ pins its Vite core, Vitest, Oxlint and Oxfmt: they move as one
      vite-plus:
        patterns: ["vite-plus", "vite", "@voidzero-dev/*"]
      tauri:
        patterns: ["@tauri-apps/*"]
    ignore:
      # pinned to the range @vitejs/plugin-react declares (`^0.152.0` is `<0.153.0`); moves with it, by hand
      - dependency-name: "oxc-transform-react"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
