name: "Build Tauri Assets"

# Builds the assets into the draft release that release-please created for the tag, then publishes it.
# Run it manually to retry a release whose build failed.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag of the draft release (e.g., v0.4.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Tag of the draft release"
        required: true
        type: string
      release_id:
        description: "Id of the draft release; looked up by tag if empty"
        required: false
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_API_ISSUER:
        required: true
      APPLE_API_KEY:
        required: true
      APPLE_API_PRIVATE_KEY:
        required: true

permissions: {}

concurrency:
  group: build-tauri-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      # draft releases are visible only with write access
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - name: Find the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if [ -n "$RELEASE_ID" ]; then
            release=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '{databaseId: .id, isDraft: .draft, body}')
          else
            release=$(gh release view "$TAG_NAME" --json databaseId,isDraft,body)
          fi
          if [ "$(jq -r .isDraft <<<"$release")" != "true" ]; then
            echo "::error::Release $TAG_NAME is already published"
            exit 1
          fi
          release_id=$(jq -r .databaseId <<<"$release")
          # tauri-action silently skips all uploads for a non-numeric id
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected release id '$release_id' for $TAG_NAME"
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          delimiter="notes_$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; jq -r .body <<<"$release"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: resolve-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            # bundles bd-host, the binary of the remote runs (scripts/build-bd-host.mjs)
            args: "--target aarch64-apple-darwin --config src-tauri/tauri.macos-bd-host.conf.json"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "windows-latest"
            # bundles the console bd.exe (scripts/build-bd.mjs)
            args: "--config src-tauri/tauri.windows-bd.conf.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          missing=false
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name; see docs/guidelines/releases.md"
              missing=true
            fi
          done
          if [ "$missing" = true ]; then
            exit 1
          fi
          case "$APPLE_SIGNING_IDENTITY" in
            "Developer ID Application: "*) ;;
            *) echo "::error::APPLE_SIGNING_IDENTITY must name a Developer ID Application certificate"; exit 1 ;;
          esac
          umask 077
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$RUNNER_TEMP/branch-deck-notarization.p8"
          openssl pkey -in "$RUNNER_TEMP/branch-deck-notarization.p8" -noout

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Vite+ of pnpm-workspace.yaml, Node.js of .node-version, pnpm of `packageManager`; then `vp install`
      - name: Set up Vite+, Node.js and pnpm
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .node-version
          # a release builds from a clean install
          cache: false

      - name: Build and attach assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Tauri imports the .p12 into a temporary keychain, signs, notarizes and staples the app.
          # Apple credentials are passed only to the macOS build.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ runner.os == 'macOS' && format('{0}/branch-deck-notarization.p8', runner.temp) || '' }}
          # the Branch Deck OAuth app of the GitHub sign-in (spec/repository/github-sign-in.spec.md); public, the device
          # flow has no client secret
          BRANCH_DECK_GITHUB_CLIENT_ID: Ov23liKt3gDvjXz8peJ6
        with:
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          # publish-release writes latest.json from the uploaded bundles and their .sig files
          uploadUpdaterJson: false
          # a failed build or upload
          retryAttempts: 2
          args: ${{ matrix.args }}

      - name: Verify macOS signing and notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app=target/aarch64-apple-darwin/release/bundle/macos/BranchDeck.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          # Tauri puts the stapled app in a signed DMG; the DMG has no separate notarization ticket.
          for dmg in target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
          done

      - name: Remove notarization key
        if: ${{ always() && runner.os == 'macOS' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/branch-deck-notarization.p8"

  publish-release:
    needs: [resolve-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_ID: ${{ needs.resolve-release.outputs.release_id }}
    steps:
      # One writer of latest.json: tauri-action merged it in every build job without a lock, so the last job dropped the
      # platforms of the others while every job passed. The URLs are the github.com download URLs, which are not subject
      # to the anonymous API rate limit.
      - name: Write latest.json
        shell: bash
        env:
          NOTES: ${{ needs.resolve-release.outputs.notes }}
        run: |
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets" | jq -s add > assets.json
          mkdir -p upload
          # the platform keys of tauri-action's latest.json and the name suffix of each updater bundle
          platforms='{}'
          for entry in \
            darwin-aarch64-app=_aarch64.app.tar.gz \
            linux-x86_64-appimage=_amd64.AppImage \
            linux-x86_64-deb=_amd64.deb \
            linux-x86_64-rpm=.x86_64.rpm \
            windows-x86_64-msi=_x64_en-US.msi \
            windows-x86_64-nsis=_x64-setup.exe; do
            key="${entry%%=*}"
            suffix="${entry#*=}"
            bundle=$(jq -c --arg suffix "$suffix" '[.[] | select(.name | endswith($suffix))]' assets.json)
            name=$(jq -r 'if length == 1 then .[0].name else empty end' <<<"$bundle")
            sig_id=$(jq -r --arg name "$name.sig" '.[] | select(.name == $name) | .id' assets.json)
            if [ -z "$name" ] || [ -z "$sig_id" ]; then
              echo "::error::$key: no single *$suffix asset with its .sig in release $TAG_NAME; re-run the build job of that platform"
              exit 1
            fi
            signature=$(gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$sig_id")
            platforms=$(jq --arg key "$key" --arg signature "$signature" \
              --arg url "https://github.com/$GH_REPO/releases/download/$TAG_NAME/$name" \
              '.[$key] = {signature: $signature, url: $url}' <<<"$platforms")
          done
          # the keys the updater reads; the others are for install.sh and install.ps1
          jq -n --arg version "${TAG_NAME#v}" --arg notes "$NOTES" --argjson platforms "$platforms" '{
            version: $version,
            notes: $notes,
            pub_date: (now | todate),
            platforms: ({
              "darwin-aarch64": $platforms["darwin-aarch64-app"],
              "linux-x86_64": $platforms["linux-x86_64-appimage"],
              "windows-x86_64": $platforms["windows-x86_64-msi"]
            } + $platforms)
          }' > upload/latest.json
          cat upload/latest.json

      - name: Publish the release
        shell: bash
        run: |
          gh release upload "$TAG_NAME" upload/latest.json --clobber
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
