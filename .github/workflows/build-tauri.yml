name: "Build Tauri Assets"

# Builds the assets into the draft release that release-please created for the tag, then publishes it.
# Run it manually to retry a release whose build failed.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag of the draft release (e.g., v0.4.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Tag of the draft release"
        required: true
        type: string
      release_id:
        description: "Id of the draft release; looked up by tag if empty"
        required: false
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true

permissions: {}

concurrency:
  group: build-tauri-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      # draft releases are visible only with write access
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - name: Find the draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if [ -n "$RELEASE_ID" ]; then
            release=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '{databaseId: .id, isDraft: .draft, body}')
          else
            release=$(gh release view "$TAG_NAME" --json databaseId,isDraft,body)
          fi
          if [ "$(jq -r .isDraft <<<"$release")" != "true" ]; then
            echo "::error::Release $TAG_NAME is already published"
            exit 1
          fi
          release_id=$(jq -r .databaseId <<<"$release")
          # tauri-action silently skips all uploads for a non-numeric id
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected release id '$release_id' for $TAG_NAME"
            exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          delimiter="notes_$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; jq -r .body <<<"$release"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: resolve-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "windows-latest"
            # bundles the console bd.exe (scripts/build-bd.mjs)
            args: "--config src-tauri/tauri.windows-bd.conf.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Vite+ of pnpm-workspace.yaml, Node.js of .node-version, pnpm of `packageManager`; then `vp install`
      - name: Set up Vite+, Node.js and pnpm
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          # a release builds from a clean install
          cache: false

      - name: Build and attach assets
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # the Branch Deck OAuth app of the GitHub sign-in (spec/repository/github-sign-in.spec.md); public, the device
          # flow has no client secret
          BRANCH_DECK_GITHUB_CLIENT_ID: Ov23liKt3gDvjXz8peJ6
        with:
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          # release notes in latest.json
          releaseBody: ${{ needs.resolve-release.outputs.notes }}
          # the jobs merge latest.json concurrently and conflict on it
          retryAttempts: 2
          args: ${{ matrix.args }}

  publish-release:
    needs: [resolve-release, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ inputs.tag_name }}
      RELEASE_ID: ${{ needs.resolve-release.outputs.release_id }}
    steps:
      # tauri-action links API asset URLs; use the github.com download URLs of earlier releases,
      # which are not subject to the anonymous API rate limit
      - name: Rewrite latest.json download URLs
        shell: bash
        run: |
          gh api --paginate "repos/$GH_REPO/releases/$RELEASE_ID/assets" | jq -s add > assets.json
          asset_id=$(jq -r '.[] | select(.name == "latest.json") | .id' assets.json)
          if [ -z "$asset_id" ]; then
            echo "::error::latest.json is missing in release $TAG_NAME; re-run one build job to recreate it"
            exit 1
          fi
          mkdir -p original upload
          gh api -H 'Accept: application/octet-stream' "repos/$GH_REPO/releases/assets/$asset_id" > original/latest.json
          jq --slurpfile assets assets.json --arg base "https://github.com/$GH_REPO/releases/download/$TAG_NAME/" '
            ($assets[0] | map({key: (.id | tostring), value: .name}) | from_entries) as $names
            | .platforms |= map_values(.url |= (
                if test("/releases/assets/[0-9]+$")
                then $base + $names[capture("/releases/assets/(?<id>[0-9]+)$").id]
                else . end))
          ' original/latest.json > upload/latest.json

      # tauri-action merges latest.json from all jobs without a lock, so a platform can get lost while every job passes
      - name: Verify latest.json
        shell: bash
        run: |
          jq -e --slurpfile assets assets.json --arg version "${TAG_NAME#v}" \
            --arg base "https://github.com/$GH_REPO/releases/download/$TAG_NAME/" '
            ($assets[0] | map(.name)) as $names
            | .version == $version
              and ((["darwin-aarch64", "linux-x86_64", "windows-x86_64"] - (.platforms | keys)) == [])
              and (.platforms | all(
                (.signature | length > 0)
                and (.url | startswith($base))
                and ((.url | ltrimstr($base)) as $name | any($names[]; . == $name))))
          ' upload/latest.json || {
            echo "::error::latest.json is incomplete; re-run the build job of the missing platform"
            cat upload/latest.json
            exit 1
          }

      - name: Publish the release
        shell: bash
        run: |
          gh release upload "$TAG_NAME" upload/latest.json --clobber
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -f make_latest=true --silent
