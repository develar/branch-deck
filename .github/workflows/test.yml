name: 'test-on-pr'

on: [pull_request]

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Apple Silicon macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Upgrade Git to latest version (macOS)
        if: runner.os == 'macOS'
        run: brew upgrade git || brew install git

      - name: Upgrade Git to latest version (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git

      # Branch Deck requires Git 2.54+ (MIN_VERSION in crates/git-executor/src/git_info.rs)
      - name: Check Git version
        shell: bash
        run: |
          too_old() {
            read -r major minor <<< "$(git --version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/')"
            [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 54 ]; }
          }
          if too_old && [ "$RUNNER_OS" = "Windows" ]; then
            choco upgrade git -y --no-progress
          fi
          git --version
          if too_old; then
            echo "Git is older than the required 2.54" >&2
            exit 1
          fi

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12

      - name: setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up the linux and windows builds.
          target: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest@0.9.148

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        run: pnpm install

      - name: Run frontend linting
        run: pnpm lint

      - name: Run Rust tests
        run: pnpm test
        env:
          NEXTEST_PROFILE: ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No tagName/releaseId, so nothing is uploaded to a release in test mode.
          # PR builds have no signing key, so skip code and updater signing.
          args: ${{ matrix.args }} --no-sign
