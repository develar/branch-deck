name: "test-on-pr"

on: [pull_request]

permissions:
  contents: read

# a new push to the pull request cancels the run of the previous one
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Apple Silicon macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: "ubuntu-24.04"
            args: ""
          - platform: "windows-latest"
            # bundles the console bd.exe (scripts/build-bd.mjs)
            args: "--config src-tauri/tauri.windows-bd.conf.json"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upgrade Git to latest version (macOS)
        if: runner.os == 'macOS'
        run: brew upgrade git || brew install git

      - name: Upgrade Git to latest version (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git

      # Branch Deck requires Git 2.54+ (MIN_VERSION in crates/git-executor/src/git_info.rs)
      - name: Check Git version
        shell: bash
        run: |
          too_old() {
            read -r major minor <<< "$(git --version | sed -E 's/^git version ([0-9]+)\.([0-9]+).*/\1 \2/')"
            [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 54 ]; }
          }
          if too_old && [ "$RUNNER_OS" = "Windows" ]; then
            choco upgrade git -y --no-progress
          fi
          git --version
          if too_old; then
            echo "Git is older than the required 2.54" >&2
            exit 1
          fi

      - name: install Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up the linux and windows builds.
          target: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest@0.9.148

      - name: install dependencies (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Vite+ of pnpm-workspace.yaml, Node.js of .node-version, pnpm of `packageManager`; then `vp install`
      - name: Set up Vite+, Node.js and pnpm
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true

      # checks only, never --fix: unformatted or unlinted code fails here instead of being fixed in the runner
      - name: Check formatting, lint and types
        run: vp check

      - name: Type-check and find copies
        run: pnpm lint:typecheck && pnpm lint:cpd

      - name: Check Rust formatting and clippy
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: pnpm test
        env:
          NEXTEST_PROFILE: ci

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No tagName/releaseId, so nothing is uploaded to a release in test mode.
          # PR builds have no signing key, so skip code and updater signing.
          args: ${{ matrix.args }} --no-sign
