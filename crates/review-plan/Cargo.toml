[package]
name = "review-plan"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The plan of a review (experimental): the reviewed tip of a local branch and what changed since it, the API surface with its accio fan-in, the facts of each file, the links between the files, the dependency changes of the build files, the registrations of the plugin descriptors, the texts of the UI of the message bundles and the dependency order, read by `bd review-plan` and the review windows"
publish = false

[dependencies]
git-executor = { path = "../git-executor" }
git-ops = { path = "../git-ops" }
# the virtual branch of a name (`to_final_branch_name`)
domain-types = { path = "../domain-types" }
# the baseline of the checked out branch when the caller knows none (`detect_baseline_branch`)
history-rewrite = { path = "../history-rewrite" }
# the diffs and the syntax summaries of the reviewed commits, the forms of their declarations (`changed_declarations`)
trial-check = { path = "../trial-check" }
code-symbols = { path = "../code-symbols" }
# the tokens of a file and the rule "equal by tokens", the grammar of a path
code-tokens = { path = "../code-tokens" }
# the specs as their formats define them (OpenSpec's, IntelliJ's `*.spec.md`): the rules of a new spec, the `[@test]`
# lines of a change, a link's path by its format's rule; psi-syntax's reader, which accio's records share (accio's
# decision 2026-11-10-specs-parsed-by-spec-syntax), a revision of develar/psi-syntax, its public mirror
spec-syntax = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316" }
object-cache = { path = "../object-cache" }
# the blocks of the diffs, and accio for the fan-in, the tests and the descriptors (`SymbolIndex`, `Lenient`)
file-diffs = { path = "../file-diffs" }
# the marks of the diffs what a range leaves to read is proven from (`reading`)
text-diff = { path = "../text-diff" }
# the answers of the index a diff decides by (`diff_marks::index`)
diff-marks = { path = "../diff-marks" }
# the generated files: by their name, the attributes of the head, the header a tool wrote (`files::generated_of`)
generated-files = { path = "../generated-files" }
# the span of the fan-in's threads (`in_current_span`), the grammar of a body and the subject without its prefix
sync-utils = { path = "../sync-utils" }
# the blocks of a body that changed since the review (`lcs::diff::build_changes`)
line-diff = { path = "../line-diff" }
# the dependency entries of the build files: the `*.iml` and the plugin descriptors, `Cargo.toml`, `package.json`
quick-xml = "0.42"
toml = "1.2"
serde_json.workspace = true
# the fingerprints of the units (`units`): a digest that stays the same across versions and machines
sha2 = "0.11.1"
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
# the schema of `bd schema` (`PairState`)
schemars = { workspace = true, optional = true }
# the types of the app's commands in `src/lib/bindings.ts`
specta = { workspace = true, optional = true }

[features]
schemars = ["dep:schemars", "git-ops/schemars", "generated-files/schemars", "domain-types/schemars"]
specta = ["dep:specta", "git-ops/specta", "generated-files/specta", "domain-types/specta"]

[dev-dependencies]
test-utils = { path = "../test-utils" }
pretty_assertions.workspace = true
test-log.workspace = true

[lints]
workspace = true
