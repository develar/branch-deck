[package]
name = "bd-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "`bd-host`: the binary of the remote runs, the client and the agent on a host; neither bd nor the app links it"
# the build script of bd-core: `BD_VERSION`, the version of Branch Deck that the hello and the upgrade compare
build = "../bd-core/build.rs"
publish = false

[[bin]]
name = "bd-host"
path = "src/main.rs"

# bd-host runs only on Unix: its main on Windows only says so and needs none of them
[target.'cfg(unix)'.dependencies]
# the protocol, the refusal codes, the SHA-256 of this binary
host-link = { path = "../host-link" }
# the client: run, follow, cancel, fetch, forget, runs, hello, slots, setup over ssh, upgrade, the report
host-client = { path = "../host-client" }
# the agent: serve, supervise, setup --agent, the lend table of `slots --local`
host-agent = { path = "../host-agent" }
# the git of the client (`GitInfo::discover_for_cli`)
git-executor = { path = "../git-executor" }
# the renames and removals of the skill files
sync-utils = { path = "../sync-utils" }
clap = { version = "4.6", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
# the JSON schemas of the report and of the hello (`schema`)
schemars.workspace = true
# the descriptor of `--report-fd`
libc = "0.2.191"

[target.'cfg(unix)'.dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
# a repository of a process test
test-utils = { path = "../test-utils" }

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
