[package]
name = "lease-pool"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The lease pool of agent worktrees (`bd lease`), its clean rules and the agent workspace (`bd workspace`)"
publish = false

[dependencies]
sync-core = { path = "../sync-core" }
history-rewrite = { path = "../history-rewrite" }
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
sync-utils = { path = "../sync-utils" }
anyhow.workspace = true
# the wait of a lend for a host slot (`host_slots::lend_waiting`)
notify.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
schemars = { workspace = true, optional = true }
# the clean rules of `.branchdeck.toml` (`lease_clean`)
toml = "1.1"
# the output of Homebrew of `ensure_host_git` (`host_git`)
tempfile.workspace = true
# the ids and the default holders of the leases (`lease`)
uuid = { version = "1.29", features = ["v4"] }

# the APFS clone of a new lease slot (`clone_dir`)
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[features]
default = []
# `AgentDefaults` in the JSON schema of `bd install`
schemars = ["dep:schemars"]

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile.workspace = true
# a git that works in a unit or an entry the clean rules remove (`git_in_directory`)
test-utils = { path = "../test-utils" }

[lints]
workspace = true
