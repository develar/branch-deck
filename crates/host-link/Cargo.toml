[package]
name = "host-link"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The link of the remote runs of bd-host: the identity files, TLS 1.3 with pinned certificates, the frames, the protocol host-link and the relay"
publish = false

[dependencies]
# TLS 1.3 with pinned certificates on the provider of the app (`tls`, `channel`)
rustls.workspace = true
# the self-signed certificate of each end (`tls`)
rcgen.workspace = true
# the fingerprint of a certificate and the build id of a binary (`digest`, `identity`)
sha2 = "0.11.1"
# the messages of the protocol (`proto`)
serde.workspace = true
serde_json.workspace = true
# the JSON schemas of a refusal and of a step, which `bd-host schema` prints (`refusal`, `proto`)
schemars.workspace = true
# the errors of the link, of `[host]` and the refusals (`channel`, `config`, `refusal`)
thiserror.workspace = true
# `[host]` of `.branchdeck.toml` (`config`)
toml = "1.1"
# the rule of a run id and a base name, the renames and removals that wait out a holder on Windows, the 0600 files and
# the start of `nc` without a console window
sync-utils = { path = "../sync-utils" }

# the relay: `nc` responsible for itself (`disclaim`)
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
