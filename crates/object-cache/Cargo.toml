[package]
name = "object-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Disk cache keyed by git object ids (LMDB via psi-syntax's lmdb-env), shared by the app and the bd CLI"

[dependencies]
# The LMDB environment and its rules, shared with accio (decision 2026-11-09-lmdb-env-in-psi-syntax of accio): a revision
# of develar/psi-syntax, the public mirror, of its own in the workspace's dependencies. It moves apart from the revision
# of the other crates of psi-syntax, which keys the cached summaries (`file_diffs::PSI_SYNTAX_REVISION`): a fix of the
# environment makes no summary again.
lmdb-env.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde.workspace = true
specta = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
test-log.workspace = true

[features]
default = []
specta = ["dep:specta"]

[lints]
workspace = true
