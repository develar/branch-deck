[package]
name = "bd-lease"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "`bd lease`: the worktrees of the lease pool, one agent session per slot"
publish = false

[dependencies]
bd-core = { path = "../bd-core" }
domain-types = { path = "../domain-types" }
git-executor = { path = "../git-executor" }
git-ops = { path = "../git-ops" }
history-rewrite = { path = "../history-rewrite" }
lease-pool = { path = "../lease-pool" }
sync-core = { path = "../sync-core" }
sync-utils = { path = "../sync-utils" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
schemars.workspace = true
serde.workspace = true

[dev-dependencies]
# the tests run bd through its Cli: a dev-dependency cycle, which cargo allows
bd-cli = { path = "../bd-cli", features = ["fixtures"] }
test-utils = { path = "../test-utils" }
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
test-log.workspace = true

[lints]
workspace = true
