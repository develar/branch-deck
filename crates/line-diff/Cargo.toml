[package]
name = "line-diff"
version.workspace = true
edition.workspace = true
# the code is ported from IntelliJ Platform, see NOTICE
license = "Apache-2.0"
description = "Line, word and char comparison of two texts, ported from IntelliJ, and the lines a change moved"

[dependencies]
fixedbitset = "0.5.7"
icu_properties = "2.4.0"
rustc-hash = "2.1.3"
serde = { version = "1", features = ["derive"] }
sha1 = "0.11.0"

[dev-dependencies]
pretty_assertions = "1.4"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1"

[lints]
workspace = true
