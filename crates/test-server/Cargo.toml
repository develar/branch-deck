[package]
name = "test-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "test-server"

[lib]
name = "test_server"
path = "src/lib.rs"

[[bin]]
name = "test-server"
path = "src/main.rs"

[dependencies]
repository-model = { path = "../repository-model" }
operations = { path = "../operations" }
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tokio-stream.workspace = true

# Use the git operations crate
branch-integration = { path = "../branch-integration" }
git-ops = { path = "../git-ops" }
file-diffs = { path = "../file-diffs" }
review-plan = { path = "../review-plan" }
git-executor = { path = "../git-executor" }
object-cache = { path = "../object-cache" }
github = { path = "../github", features = ["fake"] }
patronus = { path = "../patronus", features = ["fake"] }
test-utils = { path = "../test-utils", features = ["http"] }
sync-core = { path = "../sync-core" }
remote-facts = { path = "../remote-facts" }
trial-check = { path = "../trial-check" }
update-core = { path = "../update-core" }
history-rewrite = { path = "../history-rewrite" }
domain-types = { path = "../domain-types" }
domain-policy = { path = "../domain-policy" }
# `api_error`: a core's error as the `ApiError` the app answers
app-api = { path = "../app-api" }
# the types of the commands of Start in Air, which the registry names by their path
air-launch = { path = "../air-launch" }
# the writer of the settings of a test repository (`TestRepository::store`), as the app's
app-settings = { path = "../app-settings" }
cli-tools = { path = "../cli-tools" }
sync-utils = { path = "../sync-utils" }
youtrack = { path = "../youtrack", features = ["fake"] }
tempfile.workspace = true
fs_extra = "1.3.0"
# the APFS clone of a template into the repository of a test (`clone_dir`)
lease-pool = { path = "../lease-pool" }
dashmap.workspace = true

[dev-dependencies]
reqwest.workspace = true
# the builders of the fixtures (`domain_types::fixtures`)
domain-types = { path = "../domain-types", features = ["fixtures"] }
pretty_assertions = { workspace = true }
# the cases of the adapters' contract test (`api_error_contract_test.rs`)
app-api = { path = "../app-api", features = ["fixtures"] }

[lints]
workspace = true
