[package]
name = "test-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "test-server"

[lib]
name = "test_server"
path = "src/lib.rs"

[[bin]]
name = "test-server"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tokio-stream.workspace = true

# Use the git operations crate
branch-integration = { path = "../branch-integration" }
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
object-cache = { path = "../object-cache" }
test-utils = { path = "../test-utils" }
sync-core = { path = "../sync-core" }
sync-types = { path = "../sync-types" }
tempfile.workspace = true
fs_extra = "1.3.0"
dashmap.workspace = true

[dev-dependencies]
reqwest.workspace = true
pretty_assertions = { workspace = true }

[lints]
workspace = true
