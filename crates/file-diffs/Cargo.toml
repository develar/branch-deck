[package]
name = "file-diffs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The typed diffs of the files of a commit, a range or the working tree, for the views of the app"

[dependencies]
code-symbols = { path = "../code-symbols" }
# the tokens of a file and the rule "equal by tokens", the grammar of a path
code-tokens = { path = "../code-tokens" }
# the names of the generated files, which start collapsed (`collapse_of`)
generated-files = { path = "../generated-files" }
git-executor = { path = "../git-executor" }
git-ops = { path = "../git-ops" }
object-cache = { path = "../object-cache" }
sync-utils = { path = "../sync-utils" }
line-diff = { path = "../line-diff" }
# the merge of three texts (`merge_model`, `compose`) and the wire model of the diffs for the bindings
text-diff = { path = "../text-diff" }

anyhow.workspace = true
moka.workspace = true
serde.workspace = true
serde_json.workspace = true
specta = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
# the benchmark of the marks (`benches/marks_bench.rs`)
criterion = "0.8"
pretty_assertions.workspace = true
tempfile.workspace = true
test-log.workspace = true
test-utils = { path = "../test-utils" }

[[bench]]
name = "marks_bench"
harness = false

[features]
default = []
specta = ["dep:specta", "object-cache/specta", "text-diff/specta", "generated-files/specta"]

[lints]
workspace = true
