[package]
name = "host-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The client of the remote runs of brd-host: the run, the commit of the working tree, the pack, the follow, the fetch, the base sync and the host files"
publish = false

# The architecture test keeps it off the lease pool and the agent. Unix only, as brd-host (src/lib.rs), so on Windows
# the crate is empty and needs none
[target.'cfg(unix)'.dependencies]
# Ctrl+C of a run (`interrupt`)
# SIGTERM and SIGHUP too (`termination`): a client that a tool or a closed terminal stops cancels its run, rather than
# leave it to wait for its slot or the heavy turn and to run for nobody
ctrlc = { workspace = true, features = ["termination"] }
# the identity, the pinned channel, the protocol, the refusal codes and `[host]` of a commit
host-link = { path = "../host-link" }
# the client runs on tokio, as its channel: the waits, the deadlines, the lookup of a host name, the git of a step on the
# blocking pool beside the connections (`run`, `pack`, `wait`, `host`)
tokio = { workspace = true, features = ["time"] }
# the stop of a follow, of a base sync and of the question to the host while the status of the checkout runs (`run`)
tokio-util.workspace = true
# the estimates of the members of a set of hosts, asked at once (`choose`)
futures-util.workspace = true
# the git of the client in process: the snapshot, the thin pack, the blob of `[host]` and the apply (`git`)
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
# the errors of git-ops (`git`)
anyhow.workspace = true
# the 0600 files, the renames and removals that wait out a holder, the span of a thread, and the start of ssh
sync-utils = { path = "../sync-utils" }
# the host files, the run records and the report of a run
serde.workspace = true
serde_json.workspace = true
# the JSON schemas of the report and of the hello, which `brd-host schema` prints (`report`)
schemars.workspace = true
# the fetch: `O_NOFOLLOW` of the open of a part
libc = "0.2.191"
# the start of a run of `brd-host runs` in the time zone of the client (`phases::run_line`)
jiff = { workspace = true, features = ["tz-system"] }

[target.'cfg(unix)'.dev-dependencies]
pretty_assertions.workspace = true
# the tests on paused time
tokio = { workspace = true, features = ["test-util"] }
# the span of the tasks of the fake agent (`testkit`)
tracing.workspace = true
tempfile.workspace = true
test-utils = { path = "../test-utils" }

[lints]
workspace = true
