[package]
name = "youtrack"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true, optional = true }
base64 = "0.22.1"
getrandom.workspace = true
moka.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
sync-types = { path = "../sync-types" }
sync-utils = { path = "../sync-utils" }
tokio = { workspace = true, features = ["time", "io-util"] }
tracing.workspace = true
url = "2.5.8"

[features]
# the in-process YouTrack of the tests (`fake_youtrack`), for the tests of other crates
fake = ["dep:axum"]

[dev-dependencies]
axum.workspace = true
github = { path = "../github", features = ["fake"] }
pretty_assertions.workspace = true
tempfile.workspace = true
test-log.workspace = true
tokio = { workspace = true, features = ["time", "io-util"] }

[lints]
workspace = true
