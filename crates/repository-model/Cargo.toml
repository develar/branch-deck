[package]
name = "repository-model"
version.workspace = true
edition.workspace = true
license.workspace = true

# The model of a repository, grown from what Rust derives of the branch table for the page and for `bd`
# (docs/design/git-operations.md, "Repository view"): the table of a sync, the Patronus section and the guards of the
# app's actions, one rule over the content walks of sync-core
[dependencies]
sync-core = { path = "../sync-core" }
trial-check = { path = "../trial-check" }
history-rewrite = { path = "../history-rewrite" }
domain-types = { path = "../domain-types" }
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
object-cache = { path = "../object-cache" }
patronus = { path = "../patronus" }
sync-utils = { path = "../sync-utils" }
moka = { workspace = true, features = ["sync"] }
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
test-utils = { path = "../test-utils" }

[lints]
workspace = true
