[package]
name = "repository-model"
version.workspace = true
edition.workspace = true
license.workspace = true

# The model of a repository, grown from what Rust derives of the branch table for the page and for `bd`
# (docs/design/git-operations.md, "Session facts"): the sessions with their table and facts, the Patronus section and
# the guards of the app's actions, one rule over the content walks of sync-core; it runs no trial check (the hosts
# answer the landing needs and the landing gate)
[dependencies]
sync-core = { path = "../sync-core" }
history-rewrite = { path = "../history-rewrite" }
domain-types = { path = "../domain-types" }
domain-policy = { path = "../domain-policy" }
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
patronus = { path = "../patronus" }
sync-utils = { path = "../sync-utils" }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true

[dev-dependencies]
domain-types = { path = "../domain-types", features = ["fixtures"] }
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
test-utils = { path = "../test-utils" }

[lints]
workspace = true
