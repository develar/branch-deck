[package]
name = "bd-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The bd commands of the remote: status, push, safe-push, request-review, robot, and the landed branches"
publish = false

[dependencies]
repository-model = { path = "../repository-model" }
commit-clustering = { path = "../commit-clustering" }
bd-core = { path = "../bd-core" }
git-ops = { path = "../git-ops", features = ["schemars"] }
github = { path = "../github" }
history-rewrite = { path = "../history-rewrite" }
object-cache = { path = "../object-cache" }
patronus = { path = "../patronus" }
sync-core = { path = "../sync-core" }
remote-facts = { path = "../remote-facts" }
trial-check = { path = "../trial-check" }
domain-types = { path = "../domain-types" }
sync-utils = { path = "../sync-utils" }
youtrack = { path = "../youtrack" }
clap = { version = "4.6", features = ["derive"] }
# the system time zone of the statistics (`robot_stats_command`)
jiff = { workspace = true, features = ["tz-system"] }
schemars.workspace = true
serde.workspace = true
sha2 = "0.11.1"
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# the tests run bd through its Cli and share the fakes of bd-cli: a dev-dependency cycle, which cargo allows
bd-cli = { path = "../bd-cli", features = ["fixtures"] }
github = { path = "../github", features = ["fake"] }
patronus = { path = "../patronus", features = ["fake"] }
test-utils = { path = "../test-utils" }
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
test-log.workspace = true

[lints]
workspace = true
