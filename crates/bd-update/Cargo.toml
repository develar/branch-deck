[package]
name = "bd-update"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "`brd update`, `brd pick` and `brd undo`: the moves of the checked out branch and their undo"
publish = false

[dependencies]
bd-core = { path = "../bd-core" }
git-executor = { path = "../git-executor" }
git-ops = { path = "../git-ops" }
history-rewrite = { path = "../history-rewrite" }
lease-pool = { path = "../lease-pool" }
sync-core = { path = "../sync-core" }
update-core = { path = "../update-core" }
# `[commit] check` of .branchdeck.toml and the rules it names
commit-rules = { path = "../commit-rules" }
domain-types = { path = "../domain-types" }
sync-utils = { path = "../sync-utils" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
schemars.workspace = true
serde.workspace = true

[dev-dependencies]
# the tests run bd through its Cli: a dev-dependency cycle, which cargo allows
bd-cli = { path = "../bd-cli", features = ["fixtures"] }
test-utils = { path = "../test-utils" }
# `error_cases`: the typed errors with the one code bd and the app answer for each
update-core = { path = "../update-core", features = ["fixtures"] }
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
test-log.workspace = true

[lints]
workspace = true
