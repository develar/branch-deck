[package]
name = "test-utils"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared test utilities for Branch Deck workspace"

[dependencies]
# Core utilities (shared via workspace)
anyhow.workspace = true
tempfile.workspace = true

# Git command executor
git-executor = { path = "../git-executor" }

# The fake HTTP server of the fakes (`fake_server`), with the `http` feature
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# Note: git-ops removed to avoid circular dependency - git-ops has its own test utilities

[dev-dependencies]
test-log = { workspace = true }

[features]
default = []
# `fake_server`: a router on a loopback port, for the fakes of the service crates
http = ["dep:axum", "dep:tokio", "dep:tracing"]
[lints]
workspace = true
