[package]
name = "github"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true, optional = true }
git-executor = { path = "../git-executor" }
domain-types = { path = "../domain-types" }
sync-utils = { path = "../sync-utils" }
test-utils = { path = "../test-utils", features = ["http"], optional = true }
moka.workspace = true
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[features]
# the in-process GitHub of the tests (`fake_github`), for the tests of other crates
fake = ["dep:axum", "dep:test-utils"]

[dev-dependencies]
axum.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
test-log.workspace = true
# `fake_github` serves through `test_utils::fake_server` under `cfg(test)` too, without the workspace's feature unification
test-utils = { path = "../test-utils", features = ["http"] }
tokio = { workspace = true, features = ["time"] }

[lints]
workspace = true
