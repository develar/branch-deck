[package]
name = "code-symbols"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarations, imports and references of one source file, on psi-syntax (Kotlin, Java) and tree-sitter (Rust, TypeScript)"

[dependencies]
# Kotlin's and Java's parsers: psi-syntax's ports of the Kotlin compiler's and IntelliJ's own lexers and parsers, whose
# trees are their PSI byte for byte; pure Rust, no C. A git revision, the one accio pins; `psi-builder` is the tree both
# build, named directly for the code both languages share.
java-syntax = { git = "https://github.com/develar/psi-syntax", rev = "25dac59fe04bc1bc24452dfe57a6696c3ba57620", optional = true }
kotlin-syntax = { git = "https://github.com/develar/psi-syntax", rev = "25dac59fe04bc1bc24452dfe57a6696c3ba57620", optional = true }
psi-builder = { git = "https://github.com/develar/psi-syntax", rev = "25dac59fe04bc1bc24452dfe57a6696c3ba57620", optional = true }
serde.workspace = true
tree-sitter = "0.27.1"
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
serde_json.workspace = true

[features]
default = ["kotlin", "java", "rust", "typescript"]
kotlin = ["dep:kotlin-syntax", "dep:psi-builder"]
java = ["dep:java-syntax", "dep:psi-builder"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript"]

[lints]
workspace = true
