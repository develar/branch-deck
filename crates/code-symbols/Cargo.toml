[package]
name = "code-symbols"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarations, imports and references of one source file, its highlighting and navigation, on psi-syntax (Kotlin, Java, C#, Starlark, Rust, TypeScript)"

[dependencies]
# Kotlin's, Java's and C#'s parsers: psi-syntax's ports of the Kotlin compiler's, IntelliJ's and Roslyn's own lexers and
# parsers, whose trees are their PSI (Roslyn's syntax tree for C#) byte for byte; pure Rust, no C. They live in accio's
# repository (`psi-syntax/`), which is internal, so a revision of develar/psi-syntax, its public mirror, pins them: each
# mirrored commit names its accio commit (`Accio-Commit:`); `psi-builder` is the tree all three build, named directly
# for the code the languages share. `js-syntax` is oxc's parser of TypeScript, TSX and JavaScript with what every
# reader of psi-syntax shares of its parse (the dialects, the options, the recovery, the stack); oxc is named only
# through its re-exports. `rust-syntax` is rust-analyzer's parser, the parse accio reads Rust with; its `ra_ap_syntax`
# and `rowan` are named only through its re-exports.
csharp-syntax = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316", optional = true }
java-syntax = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316", optional = true }
js-syntax = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316", optional = true }
kotlin-syntax = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316", optional = true }
# the tokens of a file, and the one parser of each language per thread that every walk of a tree here reads it by
code-tokens = { path = "../code-tokens", default-features = false }
psi-builder = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316" }
rust-syntax = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316", optional = true }
starlark-syntax = { git = "https://github.com/develar/psi-syntax", rev = "2c8d63c1498e0b837050952d4b95fc24af8af316", optional = true }
serde.workspace = true

[dev-dependencies]
# the benchmark of the bindings of many names (`benches/names_bench.rs`)
criterion = "0.8"
pretty_assertions.workspace = true
serde_json.workspace = true
sync-utils = { path = "../sync-utils" }

[[bench]]
name = "names_bench"
harness = false

[features]
default = ["kotlin", "java", "csharp", "starlark", "rust", "typescript"]
kotlin = ["dep:kotlin-syntax", "code-tokens/kotlin"]
java = ["dep:java-syntax", "code-tokens/java"]
csharp = ["dep:csharp-syntax", "code-tokens/csharp"]
starlark = ["dep:starlark-syntax", "code-tokens/starlark"]
rust = ["dep:rust-syntax", "code-tokens/rust"]
typescript = ["dep:js-syntax", "code-tokens/typescript"]

[lints]
workspace = true
