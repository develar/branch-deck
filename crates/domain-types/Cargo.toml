[package]
name = "domain-types"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# the time zone database of `calendar`; reading the system zone (`tz-system`) is the hosts'
jiff = { workspace = true, features = ["tzdb-bundle-platform", "tzdb-zoneinfo"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
specta = { workspace = true, optional = true }
# `unknown` in TypeScript for the raw JSON of the settings (`SettingsPatch`, `SettingsChange`)
specta-typescript = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true

[features]
default = []
schemars = ["dep:schemars"]
specta = ["dep:specta", "dep:specta-typescript"]

[lints]
workspace = true
