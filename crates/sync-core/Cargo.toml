[package]
name = "sync-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
history-rewrite = { path = "../history-rewrite" }
domain-types = { path = "../domain-types" }
domain-policy = { path = "../domain-policy" }
sync-utils = { path = "../sync-utils" }
branch-integration = { path = "../branch-integration" }
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
object-cache = { path = "../object-cache" }
anyhow.workspace = true
indexmap.workspace = true
moka.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.1"
specta = { workspace = true, optional = true }
quick-xml = "0.42"
regex = "1.13"
tokio.workspace = true

[features]
default = []
specta = ["dep:specta", "history-rewrite/specta", "domain-types/specta", "branch-integration/specta", "git-ops/specta"]

[dev-dependencies]
domain-types = { path = "../domain-types", features = ["fixtures"] }
history-rewrite = { path = "../history-rewrite", features = ["test-commit"] }
test-utils = { path = "../test-utils" }
tempfile.workspace = true
tokio.workspace = true
pretty_assertions = { workspace = true }
criterion = "0.8"
test-log = { workspace = true }

[[bench]]
name = "issue_pattern_bench"
harness = false

[lints]
workspace = true
