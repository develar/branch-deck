[package]
name = "sync-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sync-types = { path = "../sync-types" }
sync-utils = { path = "../sync-utils" }
branch-integration = { path = "../branch-integration" }
git-ops = { path = "../git-ops" }
file-diffs = { path = "../file-diffs" }
text-diff = { path = "../text-diff" }
git-executor = { path = "../git-executor" }
object-cache = { path = "../object-cache" }
code-symbols = { path = "../code-symbols" }
patronus = { path = "../patronus" }
github = { path = "../github" }
anyhow.workspace = true
indexmap.workspace = true
moka.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
specta = { workspace = true, optional = true }
quick-xml = "0.42"
regex = "1.13"
tokio = { workspace = true, features = ["time"] }
# the clean rules of `.branchdeck.toml` (`lease_clean`)
toml = "1.1"
# the ids and the default holders of the leases (`lease`)
uuid = { version = "1.28", features = ["v4"] }

# the process scan of the lease pool (`process_scan`): the working directories and the argv through libproc and
# sysctl on macOS, the SIGTERM of a Bazel server of a slot, the APFS clone (`clone_dir`)
[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[features]
default = []
specta = ["dep:specta", "sync-types/specta", "branch-integration/specta", "git-ops/specta"]

[dev-dependencies]
github = { path = "../github", features = ["fake"] }
patronus = { path = "../patronus", features = ["fake"] }
test-utils = { path = "../test-utils" }
sync-test-utils = { path = "../sync-test-utils" }
tempfile.workspace = true
tokio.workspace = true
pretty_assertions = { workspace = true }
criterion = "0.8"
test-log = { workspace = true }

[[bench]]
name = "issue_pattern_bench"
harness = false

[lints]
workspace = true
