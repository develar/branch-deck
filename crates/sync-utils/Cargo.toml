[package]
name = "sync-utils"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# the random bits of an operation id (`operation_id`)
getrandom.workspace = true
jiff.workspace = true
memchr = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# the process scan of the lease pool (`process_scan`): the working directories and the argv through libproc and
# sysctl on macOS, the SIGTERM of a Bazel server of a slot
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# the process scan (`process_scan`: a toolhelp snapshot, the working directory and the arguments from the PEB through
# `NtQueryInformationProcess` and `ReadProcessMemory`, split by `CommandLineToArgvW`, the start time by
# `GetProcessTimes`) and the sharing errors that a rename or a removal waits out (`fs_retry`)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
test-utils = { path = "../test-utils" }

[lints]
workspace = true
