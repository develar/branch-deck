[package]
name = "sync-utils"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# the types the grammar of a commit answers (`commit_subject::subject_parts`, `commit_body`)
domain-types = { path = "../domain-types" }
# the random bits of an operation id (`operation_id`)
getrandom.workspace = true
# the host of a process (`process_scan::host_name`), which the operations registry of a repository records
gethostname = "1.1.0"
jiff.workspace = true
memchr = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# the process scan of the lease pool (`process_scan`): the working directories and the argv through libproc and
# sysctl on macOS, the SIGTERM of a Bazel server of a slot
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# the start time of a process (`process_scan`: `OpenProcess`, `GetProcessTimes`) and the sharing errors that a rename
# or a removal waits out (`fs_retry`), the console of the process, without which a child gets no window
# (`child_process::windowless_command`)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
test-utils = { path = "../test-utils" }

[lints]
workspace = true
