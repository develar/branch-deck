[package]
name = "git-ops"
version.workspace = true
edition.workspace = true
description = "Git operations and repository management for Branch Deck"

[dependencies]
# Core git functionality
git-executor = { path = "../git-executor" }
object-cache = { path = "../object-cache" }

# Core utilities (shared via workspace)
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Git and file operations
dashmap.workspace = true
memchr = "2.8"
tempfile.workspace = true

specta = { workspace = true, optional = true }
# `Description` in the JSON schemas of the `bd` output
schemars = { workspace = true, optional = true }

[dev-dependencies]
test-utils = { path = "../test-utils" }
pretty_assertions = { workspace = true }
test-log = { workspace = true }

[features]
default = []
specta = ["dep:specta", "object-cache/specta"]
schemars = ["dep:schemars"]

[lints]
workspace = true
