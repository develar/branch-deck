[package]
name = "git-ops"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Git operations and repository management for Branch Deck"

[dependencies]
# Core git functionality
git-executor = { path = "../git-executor" }
# the commits, conflicts and update checks it reads and reports
domain-types = { path = "../domain-types" }
object-cache = { path = "../object-cache" }
# the cut of the lists a check reports (`list_cut::kept`)
sync-utils = { path = "../sync-utils" }
text-diff = { path = "../text-diff" }

# Core utilities (shared via workspace)
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Git and file operations
dashmap.workspace = true
memchr = "2.8"
tempfile.workspace = true

specta = { workspace = true, optional = true }
# `Description` in the JSON schemas of the `bd` output
schemars = { workspace = true, optional = true }
gix-validate = "0.13.0"
bstr = { version = "1", default-features = false, features = ["std"] }
# blob ids without `hash-object` (`commit_utils::blob_id`)
sha1 = "0.10.7"
sha2 = "0.10.9"

[dev-dependencies]
test-utils = { path = "../test-utils" }
pretty_assertions = { workspace = true }
test-log = { workspace = true }
# reads the tar of `tree_archive`
tar = "0.4.46"

[features]
default = []
specta = ["dep:specta", "object-cache/specta", "domain-types/specta"]
schemars = ["dep:schemars"]

[lints]
workspace = true
