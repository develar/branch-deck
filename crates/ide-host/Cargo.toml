[package]
name = "ide-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "`branch-deck ide`: the bridge of an IDE with Air, MCP with x-air-app over stdio (or a WebSocket of the e2e server) to the one backend of the user, the desktop app, or a backend of its own"
publish = false

[dependencies]
# the services and the context of the fallback, and the class of a command (`app_api::dispatch`)
app-api = { path = "../app-api" }
# the protocol of the backend: the bridge is its client, and the fallback runs a host of its own
backend-host = { path = "../backend-host" }
# the writer of the settings and the snapshot of a window (`bd_bootstrap`)
app-settings = { path = "../app-settings" }
domain-types = { path = "../domain-types" }
# the context of the process: the memory of the diffs, the services of the sessions and of the rewrites
file-diffs = { path = "../file-diffs" }
operations = { path = "../operations" }
remote-facts = { path = "../remote-facts" }
git-executor = { path = "../git-executor" }
# the view of a mirror, applied as the page's store applies a patch (`repository_model::patch::apply_patch`)
repository-model = { path = "../repository-model" }
sync-utils = { path = "../sync-utils" }
# the name of a push mode in a notification of the IDE (`sync_core::patronus_start::push_mode_name`)
sync-core = { path = "../sync-core" }
# the bytes of a raw command and a binary file of the page in base64
base64 = "0.23.1"
# the home directory of the page (`homeDir` of `bd_bootstrap`)
dirs = "7"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "time"] }
tracing.workspace = true

# the start of the app out of the job of the IDE (`start.rs`)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Threading"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
# the app data directory of a test (`process_test.rs`)
tempfile.workspace = true
# the views of the mirror tests (`domain_types::fixtures`)
domain-types = { path = "../domain-types", features = ["fixtures"] }

[lints]
workspace = true
