[package]
name = "repository-view"
version.workspace = true
edition.workspace = true
license.workspace = true

# What Rust derives of the branch table for the page and for `bd` (docs/design/git-operations.md, "Repository view"):
# the table of a sync and the Patronus section, one rule over the content walks of sync-core
[dependencies]
sync-core = { path = "../sync-core" }
history-rewrite = { path = "../history-rewrite" }
domain-types = { path = "../domain-types" }
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
object-cache = { path = "../object-cache" }
sync-utils = { path = "../sync-utils" }
moka = { workspace = true, features = ["sync"] }
tracing.workspace = true
anyhow.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde.workspace = true
serde_json.workspace = true
test-utils = { path = "../test-utils" }

[lints]
workspace = true
