[package]
name = "operations"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The engine of the operations of the remote: an intent of the user or an agent, admitted over the operations that run in its session, run as its plan orders the effects, with the witness of the facts its plan was prepared on"
publish = false

[dependencies]
repository-model = { path = "../repository-model" }
remote-facts = { path = "../remote-facts" }
sync-core = { path = "../sync-core" }
history-rewrite = { path = "../history-rewrite" }
trial-check = { path = "../trial-check" }
# Update Project, `bd pick` and their undo, of the family `Rewrite` (`rewrite`): the pick of remote commits
update-core = { path = "../update-core" }
# the diffs a pick of remote commits reads (`rewrite::RewriteHost`)
file-diffs = { path = "../file-diffs" }
object-cache = { path = "../object-cache" }
patronus = { path = "../patronus" }
github = { path = "../github" }
domain-types = { path = "../domain-types" }
domain-policy = { path = "../domain-policy" }
git-ops = { path = "../git-ops" }
git-executor = { path = "../git-executor" }
# whether the worktree of an operation is a slot of the lease pool, for its entry in the journal (`journal`)
lease-pool = { path = "../lease-pool" }
sync-utils = { path = "../sync-utils" }
anyhow.workspace = true
# the watch of the operations registry and the stamp of a repository (`registry_watch`)
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
domain-types = { path = "../domain-types", features = ["fixtures"] }
# the fake Patronus whose requests a push counts
patronus = { path = "../patronus", features = ["fake"] }
# the fake GitHub a creation and a review request write to
github = { path = "../github", features = ["fake"] }
test-utils = { path = "../test-utils" }
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
