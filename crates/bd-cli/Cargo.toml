[package]
name = "bd-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The `bd` agent command line of Branch Deck: JSON on stdout, logs on stderr"
# the build script of bd-core: agent_help.rs names the version in a `concat!`, which takes only a literal
build = "../bd-core/build.rs"
publish = false

# the console binary Windows installs next to the app (src-tauri/tauri.windows-bd.conf.json); elsewhere the app binary
# runs the CLI
[[bin]]
name = "bd"
path = "src/main.rs"
test = false

[dependencies]
# the repositories of the tests, for `fixtures`
test-utils = { path = "../test-utils", optional = true }
bd-core = { path = "../bd-core" }
bd-lease = { path = "../bd-lease" }
bd-rewrite = { path = "../bd-rewrite" }
bd-update = { path = "../bd-update" }
bd-clustering = { path = "../bd-clustering" }
file-diffs = { path = "../file-diffs" }
git-executor = { path = "../git-executor" }
git-ops = { path = "../git-ops", features = ["schemars"] }
object-cache = { path = "../object-cache" }
patronus = { path = "../patronus" }
github = { path = "../github" }
sync-core = { path = "../sync-core" }
history-rewrite = { path = "../history-rewrite" }
code-symbols = { path = "../code-symbols" }
sync-types = { path = "../sync-types" }
sync-utils = { path = "../sync-utils" }
text-diff = { path = "../text-diff" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tar = "0.4.46"
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# `fixture_test`: the repositories and runs of bd that the tests of the crates bd-cli builds on share; only a
# dev-dependency enables it, never a build of the app
fixtures = ["dep:test-utils"]

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
patronus = { path = "../patronus", features = ["fake"] }
github = { path = "../github", features = ["fake"] }
test-utils = { path = "../test-utils" }
pretty_assertions.workspace = true
tempfile.workspace = true
test-log.workspace = true

[lints]
workspace = true
