[package]
name = "bd-cli"
version.workspace = true
edition.workspace = true
description = "The `bd` agent command line of Branch Deck: JSON on stdout, logs on stderr"
# build.rs reads src-tauri/tauri.conf.json, outside the package
publish = false

# the console binary Windows installs next to the app (src-tauri/tauri.windows-bd.conf.json); elsewhere the app binary
# runs the CLI
[[bin]]
name = "bd"
path = "src/main.rs"
test = false

[dependencies]
git-executor = { path = "../git-executor" }
git-ops = { path = "../git-ops" }
object-cache = { path = "../object-cache" }
sync-core = { path = "../sync-core" }
sync-types = { path = "../sync-types" }
sync-utils = { path = "../sync-utils" }
anyhow.workspace = true
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
schemars = "1.2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
test-utils = { path = "../test-utils" }
pretty_assertions.workspace = true
tempfile.workspace = true
test-log.workspace = true

[lints]
workspace = true
